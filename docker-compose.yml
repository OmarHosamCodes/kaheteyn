services:
  postgres:
    image: postgres:16-alpine
    container_name: kaheteyn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaheteyn
      POSTGRES_PASSWORD: kaheteyn
      POSTGRES_DB: kaheteyn
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaheteyn -d kaheteyn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
